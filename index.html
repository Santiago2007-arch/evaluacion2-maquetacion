<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- TODO (issue #2): cambia el título por el nombre de tu proyecto -->
    <title>Patitas a Casa</title>

    <!-- Bootstrap 5.3 por CDN. Tu hoja de estilos va DESPUÉS para poder personalizarlo. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <a class="visually-hidden-focusable" href="#contenido">
      Saltar al contenido
    </a>

    <header>
      <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
          <a class="navbar-brand" href="#">Patitas a Casa</a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Abrir menú"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="#catalogo">Catálogo</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#acerca">Nosotros</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#contacto">Contacto</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main id="contenido">
      <section class="container py-5" aria-labelledby="titulo-principal">
        <div class="row align-items-center g-4">
          <div class="col-md-6">
            <h1 id="titulo-principal">
              Adoptar es dar una segunda oportunidad
            </h1>

            <p>Adoptar es dar una segunda oportunidad</p>

            <a href="#catalogo" class="btn btn-primary">
              Conoce a las mascotas
            </a>
          </div>

          <div class="col-md-6">
            <img
              src="img/placeholder.svg"
              class="img-fluid rounded-4 w-100"
              alt="Imagen ilustrativa de Patitas a Casa"
            />
          </div>
        </div>
      </section>
    </main>
    <!--
    TODO (issue #2): estructura de la página. Consulta ISSUES.md, la guía y la
    página de tu empresa en el Manual de marca: ahí dice cómo va la navbar,
    el hero, cuántas columnas tiene el catálogo y de qué lado va la imagen
    de "acerca de".

    1. Enlace "Saltar al contenido" que lleve a #contenido.
    2. header con la navbar de Bootstrap que se pliega en celular
       (navbar-expand-lg, navbar-toggler accesible, div.collapse).
    3. main id="contenido" con:
       - Una sección de presentación con el ÚNICO h1 de la página.
       - Sección del catálogo (section + aria-labelledby + h2) con:
           * Grupo de filtros: div.btn-group role="group" aria-label="..."
             con un botón "todas" y uno por categoría:
             <button type="button" class="btn btn-outline-primary" data-categoria="..." aria-pressed="false">
           * label + input type="search" id="buscador"
           * label + select id="orden" con las opciones
             nombre-asc, valor-asc y valor-desc
           * p id="contador" aria-live="polite"
           * div id="catalogo" class="row ..." (aquí JS pinta las tarjetas)
       - section id="acerca" (aria-labelledby + h2) con una grilla de 2 columnas.
    4. footer.
  -->

    <!-- Bootstrap JS (necesario para que la navbar se pliegue) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- El orden importa: primero los datos, después la lógica -->
    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
